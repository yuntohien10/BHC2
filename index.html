<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중지해 | 관리자</title><style>body{margin:0;background:#f6f9fb;color:#163954;font-family:Arial,"Noto Sans KR",sans-serif}header{height:72px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #d8e3ed;font-size:21px;font-weight:800}main{max-width:760px;margin:auto;padding:45px 5vw}a{color:#2476b0;text-decoration:none;font-size:14px}h1{margin:20px 0 8px;font-size:32px}p{color:#668094;line-height:1.65}.card{margin-top:25px;padding:28px;background:#fff;border:1px solid #d8e3ed;border-radius:18px}.field{display:grid;gap:10px;margin:20px 0}label{font-weight:bold}select,input{width:100%;font:inherit}select{padding:12px;border:1px solid #cbdbe6;border-radius:10px}input{accent-color:#2485c2}.reading{padding:17px;border-radius:12px;background:#f2f7fb;font-size:26px;font-weight:bold}button{margin-top:18px;padding:12px 17px;border:0;border-radius:9px;background:#2485c2;color:#fff;font-weight:bold;cursor:pointer}#saved{margin-left:10px;color:#258761;font-size:13px}</style></head><body><header><span>중지해 관리자</span><a href="index.html">태풍 현황 지도</a></header><main><a href="index.html">← 태풍 현황 지도로</a><h1>항만 풍속 제어</h1><p>관리자만 시연용 현재 풍속을 조절할 수 있습니다. 저장한 값은 상세 페이지에 반영됩니다.</p><section class="card"><div class="field"><label for="port">항만 선택</label><select id="port"><option value="incheon">인천항</option><option value="mokpo">목포항</option><option value="yeosu">여수항</option><option value="busan">부산항</option><option value="ulsan">울산항</option><option value="pohang">포항항</option></select></div><div class="field"><label for="wind">현재 풍속</label><input id="wind" type="range" min="1" max="30" step="0.1"></div><div class="reading" id="value">— m/s</div><button id="save">풍속 저장</button><span id="saved"></span></section></main><script>sessionStorage.setItem('jungihae-admin-mode','1');const base={incheon:8.4,mokpo:15.2,yeosu:22.9,busan:25.1,ulsan:24.7,pohang:16.5},port=document.querySelector('#port'),wind=document.querySelector('#wind'),value=document.querySelector('#value'),saved=document.querySelector('#saved');function show(){value.textContent=Number(wind.value).toFixed(1)+' m/s';saved.textContent=''}function load(){wind.value=localStorage.getItem('jungihae-wind-'+port.value)||base[port.value];show()}port.onchange=load;wind.oninput=show;document.querySelector('#save').onclick=()=>{localStorage.setItem('jungihae-wind-'+port.value,wind.value);saved.textContent='저장되었습니다.'};load();</script></body></html>
